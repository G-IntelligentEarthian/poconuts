<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Coconut Husk -->
    <path d="M40 76C62 76 76 58 76 40C76 22 62 4 40 4C18 4 4 22 4 40C4 58 18 76 40 76Z" fill="#C49A45" stroke="#936D26" stroke-width="2.5"/>
    <!-- Coconut Inner Shell & Endocarp -->
    <path d="M40 70C58 70 70 55 70 40C70 25 58 10 40 10C22 10 10 25 10 40C10 55 22 70 40 70Z" fill="#5C381E"/>
    <!-- Fresh White Meat (Copra) -->
    <path d="M40 65C54 65 65 52 65 40C65 28 54 15 40 15C26 15 15 28 15 40C15 52 26 65 40 65Z" fill="#FDFBF7"/>
