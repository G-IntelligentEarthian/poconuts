  <!-- Typography: PoConuts -->
  <g transform="translate(108, 20)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" fill="#0C3B2E" letter-spacing="-0.5">
      Po<tspan fill="#C49A45">Co</tspan>nuts
    </text>
    <text x="3" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#5B7065" letter-spacing="3.8">
      POLLACHI • INDIA
    </text>
  </g>
</svg>
