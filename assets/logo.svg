    <!-- Farm Fresh Palm Leaf Accent -->
    <path d="M60 22C66 12 75 8 84 6C82 12 80 18 73 24C78 22 84 22 88 23C82 28 77 33 68 35C74 36 78 39 81 43C73 44 67 40 61 36" fill="#1B6A43" stroke="#0E4429" stroke-width="1.5" stroke-linejoin="round"/>
